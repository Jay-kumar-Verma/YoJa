# Enhanced Secure Nginx Configuration for React Frontend
# Enterprise-grade security with comprehensive hardening

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

# Security: Run as non-root user
user nginx;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic Configuration
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), fullscreen=(self)" always;
    
    # Performance and Security Settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    
    # Hide Nginx version
    server_tokens off;
    
    # Logging Configuration
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    
    access_log /dev/stdout main;
    
    # Gzip Compression with Security
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;
    
    # Security: Prevent access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        
        # Security: Server name configuration
        server_name _;
        
        # Document root
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # Security: Remove server signature
        server_tokens off;
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Security: Prevent access to sensitive files
        location ~* \.(env|git|svn|log|cache)$ {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Main application route with security
        location / {
            try_files $uri $uri/ /index.html;
            
            # Security headers for static files
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            
            # Security: Prevent hotlinking
            valid_referers none blocked server_names;
            if ($invalid_referer) {
                return 403;
            }
        }
        
        # Static assets with long-term caching
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            
            # Security: Prevent hotlinking for assets
            valid_referers none blocked server_names;
            if ($invalid_referer) {
                return 403;
            }
        }
        
        # API proxy configuration (if needed)
        location /api/ {
            # Security headers for API calls
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            
            # Proxy to backend (adjust as needed)
            proxy_pass http://backend-service:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Security: Timeout settings
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
            
            # Security: Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
        
        # Security: Block common exploit attempts
        location ~* (eval\(|base64_decode|gzinflate|<script|<iframe|<object|<embed) {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Security: Block SQL injection attempts
        location ~* (union.*select|select.*from|insert.*into|delete.*from|drop.*table) {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Security: Rate limiting for login endpoints (if applicable)
        location ~* (login|signin|authenticate) {
            limit_req zone=login burst=5 nodelay;
            try_files $uri $uri/ /index.html;
        }
        
        # Error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
    
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    
    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_conn addr 10;
}
